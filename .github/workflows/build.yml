name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: aifriend-mod
          path: build/libs/*.jar
          if-no-files-found: error
